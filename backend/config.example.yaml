# Media Manager 后端配置示例
# 拷贝为 config.yaml 后按需修改。所有字段均可省略，省略时使用代码内默认值。

# 运行期数据根目录：uploads / thumbnails / metadata / 数据库等均位于其下。
# 默认 "./data"。
data_dir: ./data

# SQLite 元数据数据库文件路径。
# 留空时自动派生为 <data_dir>/metadata.db（与代码默认一致）。
# 可指定为绝对路径以放到独立位置，如 /var/lib/media-manager/metadata.db。
db_path: ./data/metadata.db
