<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运营管理 · 看板</title>
<style>
  :root{--bg:#0f1216;--card:#1a1f26;--fg:#e6e9ef;--muted:#8b93a3;--accent:#4f9cf9;--ok:#3ec77a;--err:#ef5b5b;--bd:#2c333d;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--bd);background:#14181e;position:sticky;top:0}
  .top .brand{font-weight:600}
  .top nav a{color:var(--muted);text-decoration:none;margin-left:18px;font-size:13px}
  .top nav a:hover,.top nav a.cur{color:var(--accent)}
  .top .me{color:var(--muted);font-size:12px}
  .wrap{max-width:980px;margin:22px auto;padding:0 18px}
  h2{margin:0 0 16px;font-size:16px;font-weight:600}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
  .tile{background:var(--card);border-radius:8px;padding:16px}
  .tile .k{color:var(--muted);font-size:12px}
  .tile .v{font-size:26px;font-weight:600;margin-top:6px}
  .tile .v small{font-size:13px;color:var(--muted);font-weight:400}
  .card{background:var(--card);border-radius:8px;padding:16px;margin-bottom:22px}
  .card h3{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)}
  th{color:var(--muted);font-weight:500;font-size:12px}
  td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px}
  .pill.ok{background:rgba(62,199,122,.15);color:var(--ok)}
  .pill.off{background:rgba(239,91,91,.15);color:var(--err)}
  .pill.warn{background:rgba(79,156,249,.15);color:var(--accent)}
  .empty{color:var(--muted);font-size:13px;padding:10px 0}
  .err{color:var(--err);font-size:13px}
  @media(max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">📡 运营管理后台</div>
  <nav>
    <a href="dashboard.html" class="cur">看板</a>
    <a href="users.html">用户</a>
    <a href="servers.html">服务端</a>
    <a href="traffic.html">流量</a>
    <a href="#" id="logout">退出</a>
  </nav>
</div>
<div class="wrap">
  <h2>总览看板 <span class="me" id="me"></span></h2>
  <div class="err" id="err"></div>
  <div class="tiles">
    <div class="tile"><div class="k">受管服务端</div><div class="v" id="t-servers">–</div></div>
    <div class="tile"><div class="k">在线服务端</div><div class="v" id="t-servers-online">–</div></div>
    <div class="tile"><div class="k">设备总数</div><div class="v" id="t-devices">–</div></div>
    <div class="tile"><div class="k">在线设备</div><div class="v" id="t-devices-online">–</div></div>
    <div class="tile"><div class="k">中继会话总数</div><div class="v" id="t-sessions">–</div></div>
    <div class="tile"><div class="k">进行中会话</div><div class="v" id="t-active">–</div></div>
    <div class="tile"><div class="k">总入站流量</div><div class="v" id="t-in">–</div></div>
    <div class="tile"><div class="k">总出站流量</div><div class="v" id="t-out">–</div></div>
  </div>

  <div class="card">
    <h3>最近中继会话</h3>
    <div id="recent"></div>
  </div>
</div>
<script>
(function(){
  var tok = localStorage.getItem("ops_token");
  if (!tok) { location.href = "index.html"; return; }
  var me = document.getElementById("me");
  try {
    var acc = JSON.parse(localStorage.getItem("ops_account")||"{}");
    if (acc.username) me.textContent = "· " + acc.username;
  } catch(e){}

  document.getElementById("logout").addEventListener("click", function(e){
    e.preventDefault();
    localStorage.removeItem("ops_token");
    localStorage.removeItem("ops_account");
    location.href = "index.html";
  });

  function fmtBytes(n){
    n = Number(n)||0;
    if (n < 1024) return n + " B";
    var u=["KB","MB","GB","TB"], i=-1;
    do { n/=1024; i++; } while(n>=1024 && i<u.length-1);
    return n.toFixed(1)+" "+u[i];
  }
  function fmtTime(s){
    if (!s) return "—";
    var d=new Date(s); if(isNaN(d)) return s;
    return d.toLocaleString();
  }
  // 统一 API 请求：带 token，401 跳登录。
  function api(path){
    return fetch(path, {headers:{"Authorization":"Bearer "+tok}})
      .then(function(r){
        if (r.status===401) { location.href="index.html"; throw new Error("unauth"); }
        return r.json();
      });
  }

  var errEl = document.getElementById("err");
  Promise.all([api("api/overview"), api("api/sessions?limit=8")])
    .then(function(res){
      var o = res[0]||{}, ss = res[1]||{};
      document.getElementById("t-servers").textContent = o.servers_total ?? "0";
      document.getElementById("t-servers-online").textContent = o.servers_online ?? "0";
      document.getElementById("t-devices").textContent = o.devices_total ?? "0";
      document.getElementById("t-devices-online").textContent = o.devices_online ?? "0";
      document.getElementById("t-sessions").textContent = o.sessions_total ?? "0";
      document.getElementById("t-active").textContent = o.sessions_active ?? "0";
      document.getElementById("t-in").innerHTML = fmtBytes(o.total_bytes_in);
      document.getElementById("t-out").innerHTML = fmtBytes(o.total_bytes_out);

      var list = ss.sessions || [];
      var box = document.getElementById("recent");
      if (!list.length){ box.innerHTML = '<div class="empty">暂无中继会话</div>'; return; }
      var rows = list.map(function(x){
        var st = x.ended_at ? '<span class="pill off">已结束</span>' : '<span class="pill ok">进行中</span>';
        return '<tr><td class="mono">'+(x.id||"").slice(0,8)+'</td>'+
          '<td class="mono">'+(x.server_id||"").slice(0,8)+'</td>'+
          '<td class="mono">'+(x.pair_key||"")+'</td>'+
          '<td>'+fmtBytes(x.bytes_in+x.bytes_out)+'</td>'+
          '<td>'+fmtTime(x.started_at)+'</td>'+
          '<td>'+st+'</td></tr>';
      }).join("");
      box.innerHTML = '<table><thead><tr><th>ID</th><th>Server</th><th>对</th><th>流量</th><th>开始</th><th>状态</th></tr></thead><tbody>'+rows+'</tbody></table>';
    })
    .catch(function(e){ if(e.message!=="unauth") errEl.textContent="加载失败："+e.message; });
})();
</script>
</body>
</html>
