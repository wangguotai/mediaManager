# tasks-v4-fixes2.yaml — 剩余修复 + MVP验证

tasks:
  - id: fix-ios-keychain-v2
    product: claude
    prompt: |
      在 frontend/ 修复 iOS SettingsStorage 的 Keychain interop。
      当前 SettingsStorage.ios.kt 用 NSUserDefaults 存所有数据。需要：
      1. getString/putString 继续用 NSUserDefaults（非敏感）
      2. getSecureString/putSecureString/removeSecureString 改用 Keychain
      3. 用 Kotlin/Native 正确的 cinterop 方式调用 SecItemAdd/SecItemCopyMatching/SecItemDelete
      4. 关键：kSecClass 等 const 是 CPointer<__CFString>，不能直接传给 setObject(forKey:)，需要用 CFDictionaryRef
      5. 用 memScoped + alloc<CFTypeRefVar>() 处理 SecItemCopyMatching 返回值
      6. 如果 Keychain interop 实在搞不定，改用 iOS NSData+file 方案（写到 App Documents 目录的加密文件）
      7. compileKotlinIosArm64 必须通过
      完成后 git add -A && git commit -m "fix-ios-keychain-v2: Keychain or file-based secure storage"
    files: [frontend/]
    depends_on: []
    timeout: 400s
    max_retries: 3
    verify_commands:
      - "cd /Users/wgt/projects/media-manager/frontend && sh gradlew :composeApp:compileKotlinIosArm64"

  - id: fix-android-delete-v2
    product: claude
    prompt: |
      在 frontend/ 修复 Android 10+ 本地图片删除。
      1. 当前 PhotoGalleryService.android.kt 的 deleteMedia 用 ContentResolver.delete() — Android 10+ 会抛 SecurityException
      2. Android 10+ (API 29+) 需要 MediaStore.createDeleteRequest() 返回 PendingIntent，由 Activity 启动
      3. 实现方案：deleteMedia 返回一个特殊标记(如负数)，UI 层检测到后用 expect/actual 发起 IntentSender
      4. 或更简单：用 MediaStore.createWriteRequest (API 30+) + 回退 createDeleteRequest (API 29)
      5. < API 29 继续用 ContentResolver.delete()
      6. assembleDebug 必须通过
      完成后 git add -A && git commit -m "fix-android-delete-v2: Android 10+ recoverable deletion"
    files: [frontend/]
    depends_on: []
    timeout: 400s
    max_retries: 3
    verify_commands:
      - "cd /Users/wgt/projects/media-manager/frontend && sh gradlew :composeApp:assembleDebug"

  - id: mvp-verify-v2
    product: claude
    prompt: |
      端到端验证 V4 MVP。在 /Users/wgt/projects/media-manager 工作。
      1. cd backend && go run ./cmd/server &
      2. 等待启动，从日志提取超管账号密码
      3. curl POST /api/auth/login 登录获取 token
      4. curl POST /api/media/upload 上传一张测试图片
      5. curl GET /api/sync/changes?since=0 确认看到图片
      6. curl POST /api/media/delete 删除
      7. curl GET /api/sync/changes?since={cursor} 确认墓碑
      8. curl GET /healthz
      9. kill 后端进程
      把每步的请求/响应记录到 docs/V4-MVP-VERIFY.md
      完成后 git add -A && git commit -m "mvp-verify-v2: end-to-end verification report"
    files: [docs/]
    depends_on: [fix-ios-keychain-v2, fix-android-delete-v2]
    timeout: 400s
    max_retries: 1
    verify_commands: []
