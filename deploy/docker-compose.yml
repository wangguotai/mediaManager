# Media Manager 生产级一键部署 compose。
#
# 与 backend/docker-compose.yml 的区别：本文件编排 backend + ops-server 两个服务，
# 使用预构建镜像（不从源码 build），适合在生产/服务器环境直接 `docker compose up -d`。
#
# 用法：
#   1. cp .env.example .env  &&  编辑 .env（至少填 MM_JWT_SECRET）
#   2. ./deploy.sh            # 或 docker compose --env-file .env up -d
#   3. docker compose logs -f media-server
#
# 数据持久化：
#   media-data  → backend 容器 /app/data（上传文件、缩略图、SQLite 库等）
#   ops-data    → ops-server 容器 /data（运营 SQLite 库、会话状态）
#
# 前置条件： backend 与 ops-server 镜像已构建并推送到 registry，或在本地已 build。
#   本地构建： cd backend && docker build -t media-manager:latest .
#              cd ops-server && docker build -t media-manager/ops-server:latest .

services:
  media-server:
    image: media-manager:latest
    container_name: media-server
    restart: unless-stopped

    ports:
      - "${MM_PORT:-8080}:8080"   # REST gateway（/api/* + /healthz）

    environment:
      MM_PORT: "8080"
      MM_DATA_DIR: /app/data
      MM_DB_PATH: /app/data/media.db
      MM_JWT_SECRET: ${MM_JWT_SECRET:?MM_JWT_SECRET must be set in .env}
      MM_JWT_TTL_SECONDS: ${MM_JWT_TTL_SECONDS:-604800}
      MM_ALLOW_SIGNUP: ${MM_ALLOW_SIGNUP:-first}
      # 指向同 compose 网络内的 ops-server（service 名即主机名）。
      MM_OPS_SERVER_URL: http://ops-server:8090
      # 首次启动超管引导（可选，留空则自动生成随机密码并通过日志打印 token）。
      MM_BOOTSTRAP_ADMIN_USERNAME: ${MM_BOOTSTRAP_ADMIN_USERNAME:-admin}
      MM_BOOTSTRAP_ADMIN_PASSWORD: ${MM_BOOTSTRAP_ADMIN_PASSWORD:-}

    volumes:
      - media-data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 7s
      timeout: 3s
      start_period: 5s
      retries: 5

    depends_on:
      ops-server:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ops-server:
    image: media-manager/ops-server:latest
    container_name: ops-server
    restart: unless-stopped

    ports:
      - "${MM_OPS_HTTP_PORT:-8090}:8090"      # HTTP: REST/admin + /healthz
      - "${MM_OPS_RELAY_PORT:-18791}:18791"   # TCP relay（按需对外映射）

    environment:
      MM_OPS_HTTP_ADDR: ":8090"
      MM_OPS_RELAY_ADDR: ":18791"
      MM_OPS_DATA_DIR: "/data"
      MM_OPS_JWT_SECRET: ${MM_OPS_JWT_SECRET:?MM_OPS_JWT_SECRET must be set in .env}
      MM_OPS_JWT_TTL_SECONDS: ${MM_OPS_JWT_TTL_SECONDS:-604800}
      MM_OPS_BOOTSTRAP_ADMIN: ${MM_OPS_BOOTSTRAP_ADMIN:-admin:admin123}
      MM_OPS_SIGNUP_MODE: ${MM_OPS_SIGNUP_MODE:-first}

    volumes:
      - ops-data:/data

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  media-data:
    name: media-data
  ops-data:
    name: ops-server-data
