  1.  Root & all sections: no paddingLeft / alignItems specified -> 710-wide cards

      full-width headers/titles touch the left/right edges (0px). Intended ~20px
      safe-area horizontal padding is UNKNOWN. Rendered flush per "no padding = 0".
  2.  Root has no spacing between sections -> sections stack flush (intra-section
      spacing comes only from each section's own paddingTop).
  3.  Bottom_TabBar is the last child of a vertical root with no bottom-pin /
      absolute positioning -> it renders in flow at ~1284px, NOT pinned to the
      canvas bottom; ~340px blank space remains below it.
  4.  StatusBar: Time has no alignment/paddingLeft -> flush top-left. Intended
      padding/vertical-centering unknown.
  5.  Top_Action_Bar: no justifyContent/spacing -> Backup_Notify_Card and
      Icons_Right render adjacent flush-left. Intended split (card left, icons
      right) unknown. Icons_Right has justify flex-end but is content-sized so
      it has no effect.
  6.  Avatar_List: 5 circles x 100px, NO spacing -> rendered flush-touching.
      Gaps between avatars unknown.
  7.  Profile_Icon (CIRCLE 32) and all 5 Avatars (CIRCLE 100): no fills -> rendered
      #E0E0E0 placeholder (spec color missing).
  8.  Map_Card children (Map_Background 678, Highlight_Button 240, Stats_Row):
      no alignItems/paddingLeft on Map_Card -> flush-left within 710 card.
      Intended centering of the 678 map bg and 240 button unknown.
  9.  Highlight_Button: no spacing between Icon and Text -> flush (icon+text
      touching). Gap unknown.
  10. Stats_Row: each Item is a horizontal frame with NO spacing between label
      and value -> "旅程照片144" renders flush-concatenated. Internal spacing
      unknown.
  11. Badge (24x24 #FF3B30 with "+1"): no justifyContent -> text vertically
      centered (alignSelf center) but horizontally LEFT. Full centering unknown.
  12. Category_Grid: layoutMode wrap, NO gap -> 4x165=660 < 750 so all 4 cards
      render in ONE row flush-touching (no wrap occurs). Intended 2x2 grid +
      gaps unknown.
  13. Category card Label (RECTANGLE 165x60, child text alignSelf center):
      alignSelf=center is cross-axis only -> text vertically centered but
      horizontally LEFT. Intended horizontal center unknown.
  14. Card_Life Img fill is #FFFFFF -> effectively invisible on light bg; actual
      image content unknown.
  15. Type_Cards: layoutMode wrap, NO gap -> 2x325=650 < 750 so both cards in ONE
      row flush-touching. Intended gap/arrangement unknown.
  16. Type card internals: NO spacing between Icon/label/count and no
      justifyContent -> all flush-left in a row; count ("12"/"1") not pushed
      right. Intended layout (count right-aligned) unknown.
  17. Security_Banner: alignItems+justifyContent center given (OK), but no spacing
      between Icon and Text -> flush.
  18. Tab_Capture: CIRCLE(70,#F2F4F9) contains RECTANGLE(40,#6C5CE7) but circle
      has no alignItems/justifyContent -> inner rect top-LEFT, NOT centered.
  19. Tab bar vertical tabs: no spacing between icon and label -> flush (label
      touches icon). Small gap unknown.
  20. ALL icons are plain colored RECTANGLE/CIRCLE blocks — spec has no glyph /
      svg / icon-font data. Per instructions rendered as color blocks (no emoji /
      icon lib added). This is the single biggest fidelity loss.
  21. imageRef "map_preview": no actual image -> rendered #E6F2FF placeholder
      block with tiny gray annotation.
  22. Font family not specified -> system sans-serif used.
  =================================================================
-->
